<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Edit Class</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="CSS/add-and-edit.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

  </head>
  <body>

    <header> 
        <h1> Edit Class </h1>
        <h2>Class: <span id="class">Geography</span></h2>
    </header>

    <main> 

        <form action="main.html" method="get">

            <!-- Code for changin a class' name -->
            <label for="class-name">Change Class Name:</label>
            <input type="text" id="class-name" name="className" required placeholder="Class name here">

            <fieldset>
                <legend>Difficulty</legend>

                <label>
                    <input type="radio" name="difficulty" value="easy" required/> Easy
                </label>

                <label>
                    <input type="radio" name="difficulty" value="medium"/> Medium
                </label>

                <label>
                    <input type="radio" name="difficulty" value="hard"/> Hard
                </label>


            </fieldset>
            
            <div id="buttons">
                <button class="btn btn-primary btn" type="submit">Save Changes</button>
                <button class="btn btn-primary btn" type="submit">Delete Class</button>
                <button class="btn btn-primary btn" onclick="window.location.href='main.html'">Cancel</button>

            </div>
            
            
            
        </form>

       
    </main>
    <footer>
        <span class="text-reset">Jake Schulz, BYU Student</span>
    </footer>
  </body>
</html>
