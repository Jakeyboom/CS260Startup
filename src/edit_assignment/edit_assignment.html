<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Assignment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="CSS/add-and-edit.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

  </head>
  <body>

    <header> 
        <h1> Edit Assignment </h1>
        <h2 id="assignment-name">Section 2.4 HW</h2>
    </header>

    <main> 

        <form action="main.html" method="get">

            

            <label for="change-assignment-name">Change Assignment Name</label>
            <input type="text" id="change-assignment-name" name="changeAssignmentName" placeholder="Assignment name here" required>
            


            <!-- Code for changing which class the assignment belongs to -->
            <div>
                <label for="class-change">Change Class:</label>
                <select id="class-change" name="classChange" required>

                    <option disabled selected>----</option>
                    <option value="math">Math</option>
                    <option value="history">History</option>
                    <option value="geography">Geography</option>
                </select>

            </div>


            <label for="change-due-date">Change Due Date:</label>
            <input type="date" id="change-due-date" name="changeDueDate" required>


            <!-- Code for changing an assignment's difficulty-->
            <div>
                <fieldset>
                    <legend>Difficulty</legend>

                    <label>
                        <input type="radio" name="difficulty" value="easy" required/> Easy
                    </label>

                    <label>
                        <input type="radio" name="difficulty" value="medium"/> Medium
                    </label>
                
                    <label>
                        <input type="radio" name="difficulty" value="hard"/> Hard
                    </label>

                    
                </fieldset>
            </div>


            <div id="buttons">
                <button class="btn btn-primary btn" type="submit">Save Changes</button>
                <button class="btn btn-primary btn" type="submit">Delete Assignment</button>
                <button class="btn btn-primary btn" onclick="window.location.href='main.html'">Cancel</button>
            </div>
            

        </form>


    </main>
    <footer>
        <span class="text-reset">Jake Schulz, BYU Student</span>
    </footer>
  </body>
</html>
