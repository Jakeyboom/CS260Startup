<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <title>Login</title>
  </head>
  <body>
    <header>
      <h1>
        Welcome to AmigoOrganizado!

      </h1>
 
    </header>
  
    <main>
      <h2>
        <i>Please Login</i>
      </h2>
      <h3>
        Don't have an account? Sign up now!
      </h3>

      <!-- Here is the code that creates the login part of the page -->
      <form action="main.html" method="get"> 
          <!-- here is the email input box: -->
          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="email@email.com"/>
          </div>
          <br/>



          <!-- here is the password input box: -->
          <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="passWord123" />
          </div>

          <!-- Here is the login/create account/forgot password buttons: -->
          <button type="submit" class="btn btn-primary btn-lg">Login</button>
          <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
          <button type="submit" class="btn btn-primary btn-lg">Forgot Password</button>
        </form>
    </main>

    <footer>
      <hr> <br/>
      *****Web Page Under Construction*****
      <p>Author: Jake Robert Schulz</p>
      
    </footer>
    

  </body>
</html>
