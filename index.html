<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <title>Login</title>
  </head>
  <body>
    <header>
      <h1>
        Welcome to AmigoOrganizado!
        
      </h1>
      <h2>
        (<i>Please Login or Signup</i>)
      </h2>

 
    </header>
  
    <main>
      

      <!-- Here is the code that creates the login part of the page -->
      <form action="main.html" method="get"> 
          <!-- here is the email input box: -->
          <div class="form-row">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="email@email.com"/>
          </div>
          <br/>



          <!-- here is the password input box: -->
          <div class="form-row">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="passWord123" />
          </div>

          <!-- Here is the login/create account/forgot password buttons: -->
          <button type="submit" class="btn btn-primary btn">Login</button>
          <button type="submit" class="btn btn-primary btn">Create Account</button>
          <button type="submit" class="btn btn-primary btn">Forgot Password</button>
        </form>
    </main>

    <footer>
      
      Author: Jake Robert Schulz, BYU Student
      
    </footer>
    

  </body>
</html>
